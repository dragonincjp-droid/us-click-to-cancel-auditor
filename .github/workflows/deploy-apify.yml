name: Deploy US Click-to-Cancel & ARL Auditor to Apify

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_live_smoke_test:
        description: 'Run post-deploy live smoke test ($0.10 safety circuit breaker)'
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-apify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gate:
    name: Typecheck, Build, E2E Tests & Smoke Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Run offline E2E test suite
        run: npm test

      - name: Verify live smoke test script (--dry-run)
        run: node scripts/smoke_test_live.mjs --dry-run

  deploy-apify:
    name: Push Actor to Apify & Smoke Test
    needs: quality-gate
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check APIFY_TOKEN secret
        id: check_token
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "${APIFY_TOKEN}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## ℹ️ Native Apify Git Integration Mode (`APIFY_TOKEN` Not Set)

          Typecheck, build, and offline E2E tests **PASSED**.
          Skipping CLI `apify push` because Apify Console's native **Link Git repository (`Automatic builds`)** builds directly from `main`.
          *(Optional: add `APIFY_TOKEN` in Repository Secrets if you also want CLI push + live smoke tests from GitHub Actions.)*
          EOF
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Apify CLI & Push Actor
        if: steps.check_token.outputs.has_token == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          npm install -g apify-cli
          apify login --token "${APIFY_TOKEN}"
          apify push

      - name: Run Live Smoke Test ($0.10 Cost Cap Circuit Breaker)
        if: steps.check_token.outputs.has_token == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_live_smoke_test == true)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ secrets.APIFY_ACTOR_ID }}
        run: node scripts/smoke_test_live.mjs

      - name: Publish Deployment Summary
        if: steps.check_token.outputs.has_token == 'true' && success()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Apify Deployment & Live Smoke Test Succeeded
          EOF
          printf -- '- **Commit**: `%s`\n' "${SHORT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- **Actor**: `healthy_addax/us-click-to-cancel-auditor`\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- **Quality Gate**: Node 22 Typecheck + Build + Offline E2E Suite PASSED\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- **Live Smoke Test**: Verified within `$0.10` circuit breaker\n' >> "$GITHUB_STEP_SUMMARY"
